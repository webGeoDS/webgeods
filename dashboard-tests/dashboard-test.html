<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../shared/maplibre-gl.css">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  body { margin: 0; }
</style>
</head>
<body>
<!-- Everything else (Dashboard configs, assertions) is driven from
     run-dashboard-tests.mjs via page.evaluate() -- kept out of this
     file so new checks don't require touching the fixture, same
     convention as map-tests/map-test.html. -->
<script src="../shared/maplibre-gl.js"></script>
<script src="../shared/map.js"></script>
<script src="../shared/map-raster.js"></script>
<script src="../shared/map-table.js"></script>
<script src="../shared/table.js"></script>
<script src="../shared/d3.min.js"></script>
<script src="../shared/graph-diagram.js"></script>
<script src="../shared/upload.js"></script>
<script src="../shared/download.js"></script>
<script src="../shared/ui.js"></script>
<script src="../shared/dashboard.js"></script>
<script src="../shared/dashboard-dom.js"></script>
<script>
  // Stub for shared/code-cell.js's WebGeoDSCodeCell -- Dashboard only
  // ever needs `.find(id)` returning `{ run() }` (see dashboard.js's
  // own _cell()); the real implementation drives Pyodide/webR, which
  // this suite deliberately avoids (same reason map-tests/ needs no
  // Quarto render: fast, no cold-load, checks the JS layer on its
  // own). Tests register canned cells via WebGeoDS.CodeCell.register()
  // before constructing a Dashboard.
  window.WebGeoDS = window.WebGeoDS || {};
  window.WebGeoDS.CodeCell = {
    _registry: new Map(),
    register(id, runFn) {
      this._registry.set(id, { run: runFn });
    },
    find(id) {
      return this._registry.get(id);
    },
    reset() {
      this._registry.clear();
    }
  };
</script>
</body>
</html>
