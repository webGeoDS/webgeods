name: Deploy blog to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.29

      - name: Sync shared assets
        run: bash sync-shared-assets.sh

      - name: Render blog
        run: quarto render blog

      - name: Post-render fixups
        # Search index text leaking hidden code/comments, and the
        # navbar logo's alt text not actually being set despite a
        # valid `logo-alt:` config — see post-render-fixups.mjs's own
        # header comment for the full story on both. ubuntu-latest
        # ships Node.js already, no setup step needed.
        run: node post-render-fixups.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
